<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pitch view</title>
<style>
/* Layout: one column. A stadium canvas (stands, boards, pitch) is the page; controls sit under it.
   The canvas keeps its own night-match colours in both themes; the page chrome follows the theme. */
:root { --bg:#f1f3ee; --surface:#fafbf8; --ink:#16201a; --muted:#566259; --line:#d3d9d0;
  --home:#1c4fb5; --away:#c8202f; --dead:#8e968f; --accent:#0b6e45; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg:#0d1310; --surface:#141c17; --ink:#e4eae2;
  --muted:#9aa79d; --line:#27322b; --home:#7aa2ff; --away:#ff6874; --dead:#6d776f;
  --accent:#45d394; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-left, 0px)) 48px;
  display: grid; gap: 14px; }
h1 { margin:0; font-size: 26px; line-height: 1.1; }
.muted { color: var(--muted); }
.note { font-size: 13px; color: var(--muted); }
.panel { background: var(--surface); border:1px solid var(--line); border-radius:8px; padding:12px 14px; display:grid; gap:10px; }
.row { display:flex; flex-wrap:wrap; gap:12px 18px; align-items:center; font-size: 13px; }
.row > * { min-width: 0; }
canvas { width:100%; display:block; border-radius:8px; background:#0b1118; }
button { font: inherit; font-size: 13px; padding: 5px 14px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
button:hover { border-color: var(--ink); }
button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
.seg button { border:0; border-radius:0; }
input[type=range] { accent-color: var(--accent); }
#scrub { flex: 1 1 240px; min-width: 160px; }
.chip { display:inline-flex; gap:7px; align-items:center; padding:3px 10px; border:1px solid var(--line); border-radius:999px; font-size:12px; }
.sw { display:inline-block; width:11px; height:11px; border-radius:50%; }
.sw.ring { background: transparent; border: 2px dashed var(--muted); }
#banner { display:flex; gap:10px; align-items:center; font-size:13px; }
#banner b { display:inline-block; min-width: 26px; text-align:center; padding:1px 8px; border-radius:4px; color:#fff; font-family: ui-monospace, Menlo, monospace; }
.num { font-variant-numeric: tabular-nums; }
</style></head>
<body><main>
<div>
  <h1>Pitch view</h1>
  <p class="note" style="margin:4px 0 0">A short window of the tracking, drawn on this machine only. Contains data from the gated bundle: do not share it or upload it anywhere.</p>
</div>
<div class="panel">
  <div class="row">
    <span class="chip"><i class="sw" style="background:var(--home)"></i>home</span>
    <span class="chip"><i class="sw" style="background:var(--away)"></i>away</span>
    <span class="chip"><i class="sw" style="background:var(--dead)"></i>not assigned to a team</span>
    <span class="chip"><i class="sw" style="background:#fff;border:1px solid #888"></i>ball</span>
    <span class="chip"><i class="sw ring"></i>ball not tracked: last seen here</span>
  </div>
  <div id="banner" hidden><span class="muted">label</span><b id="lab"></b><span class="muted" id="lab-note"></span></div>
  <canvas id="cv" role="img" aria-label="Stadium view of a short window of tracking data"></canvas>
  <div class="row">
    <button id="play" type="button">Play</button>
    <input id="scrub" type="range" min="0" value="0" step="1" aria-label="Frame in the window">
    <span class="seg" role="group" aria-label="Speed">
      <button type="button" data-sp="0.25" aria-pressed="false">0.25×</button>
      <button type="button" data-sp="0.5" aria-pressed="false">0.5×</button>
      <button type="button" data-sp="1" aria-pressed="true">1×</button>
      <button type="button" data-sp="2" aria-pressed="false">2×</button>
    </span>
    <label><input id="trails" type="checkbox" checked> trails</label>
  </div>
  <div class="row muted num"><span id="fno"></span><span id="clock"></span><span id="objs"></span><span id="ballst"></span><span>Left and right arrow keys step one frame.</span></div>
</div>
<script>
var D = __DATA__;
(function () {
  "use strict";
  var PL = 105.3, PW = 68, M = 14, TRAIL = 22;
  var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  var scrub = document.getElementById("scrub"), playBtn = document.getElementById("play");
  var N = D.frames.length, cur = 0, playing = false, speed = 1, last = 0, acc = 0, showTrails = true;
  var statics = null, W = 0, Hh = 0, S = 1;
  scrub.max = Math.max(0, N - 1);
  var SIDE = ["#4f86ff", "#ff5a5f", "#9aa5a0"];
  var LAB = [["H", "#1c4fb5", "home in possession"], ["A", "#c8202f", "away in possession"], ["D", "#6d776f", "dead ball"], ["X", "#6d776f", "no label here"]];

  function rr(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  function px(x) { return (M + x * PL) * S; }
  function py(y) { return (M + y * PW) * S; }

  function buildStatic() {
    var dpr = window.devicePixelRatio || 1;
    W = cv.clientWidth; S = W / (PL + 2 * M); Hh = Math.round((PW + 2 * M) * S);
    cv.style.height = Hh + "px"; cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr);
    var off = document.createElement("canvas"); off.width = cv.width; off.height = cv.height;
    var c = off.getContext("2d"); c.scale(dpr, dpr);
    // bowl
    c.fillStyle = "#0b1118"; c.fillRect(0, 0, W, Hh);
    var g = c.createLinearGradient(0, 0, 0, Hh);
    g.addColorStop(0, "#1c2733"); g.addColorStop(0.5, "#141d27"); g.addColorStop(1, "#1c2733");
    c.fillStyle = g; rr(c, 2, 2, W - 4, Hh - 4, 26 * S / 3); c.fill();
    // seat rows: dashed concentric strokes read as blocks of seats
    var colours = ["#2b3b52", "#33465f", "#2b3b52", "#3a2f45", "#2b3b52"];
    for (var r = 0; r < 9; r++) {
      var inset = (2.2 + r * 0.95) * S;
      c.strokeStyle = colours[r % colours.length]; c.lineWidth = 0.62 * S;
      c.setLineDash([5 * S, 0.55 * S]);
      rr(c, inset, inset, W - 2 * inset, Hh - 2 * inset, Math.max(4, (9 - r * 0.6) * S));
      c.stroke();
    }
    c.setLineDash([]);
    // advertising boards
    var bx = (M - 4.6) * S, by = (M - 4.6) * S, bw = (PL + 9.2) * S, bh = (PW + 9.2) * S;
    c.fillStyle = "#0e151d"; rr(c, bx - 0.8 * S, by - 0.8 * S, bw + 1.6 * S, bh + 1.6 * S, 3 * S); c.fill();
    c.strokeStyle = "#2f7d6b"; c.lineWidth = 0.9 * S; c.setLineDash([9 * S, 4 * S]); rr(c, bx, by, bw, bh, 2.4 * S); c.stroke(); c.setLineDash([]);
    // surround and mowing stripes
    c.fillStyle = "#2f6b3a"; rr(c, (M - 3.6) * S, (M - 3.6) * S, (PL + 7.2) * S, (PW + 7.2) * S, 1.5 * S); c.fill();
    var n = 14, sw = PL / n;
    for (var i = 0; i < n; i++) {
      c.fillStyle = i % 2 ? "#3b8049" : "#357544";
      c.fillRect((M + i * sw) * S, (M - 3.6) * S, sw * S + 0.5, (PW + 7.2) * S);
    }
    // markings
    c.strokeStyle = "rgba(255,255,255,0.88)"; c.lineWidth = Math.max(1, 0.17 * S); c.fillStyle = "rgba(255,255,255,0.88)";
    c.strokeRect(M * S, M * S, PL * S, PW * S);
    c.beginPath(); c.moveTo((M + PL / 2) * S, M * S); c.lineTo((M + PL / 2) * S, (M + PW) * S); c.stroke();
    c.beginPath(); c.arc((M + PL / 2) * S, (M + PW / 2) * S, 9.15 * S, 0, 6.2832); c.stroke();
    c.beginPath(); c.arc((M + PL / 2) * S, (M + PW / 2) * S, 0.3 * S, 0, 6.2832); c.fill();
    [0, 1].forEach(function (side) {
      var dir = side ? -1 : 1, x0 = side ? M + PL : M;
      [[16.5, 40.32], [5.5, 18.32]].forEach(function (b) {
        c.strokeRect((side ? x0 - b[0] : x0) * S, (M + (PW - b[1]) / 2) * S, b[0] * S, b[1] * S);
      });
      var spot = x0 + dir * 11;
      c.beginPath(); c.arc(spot * S, (M + PW / 2) * S, 0.3 * S, 0, 6.2832); c.fill();
      c.beginPath(); c.arc(spot * S, (M + PW / 2) * S, 9.15 * S, side ? Math.PI - 0.93 : -0.93, side ? Math.PI + 0.93 : 0.93);
      c.stroke();
      // goal
      c.fillStyle = "rgba(255,255,255,0.35)";
      c.fillRect((side ? x0 : x0 - 2.2) * S, (M + PW / 2 - 3.66) * S, 2.2 * S, 7.32 * S);
      c.fillStyle = "rgba(255,255,255,0.88)";
    });
    statics = off;
  }

  function draw() {
    var dpr = window.devicePixelRatio || 1;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(statics, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var fr = D.frames[cur], i, j, k;
    var from = Math.max(0, cur - TRAIL);
    if (showTrails) {
      var tracks = {};
      for (i = from; i <= cur; i++) D.frames[i].p.forEach(function (o) { (tracks[o[0]] = tracks[o[0]] || []).push([i, o[1], o[2]]); });
      ctx.lineWidth = Math.max(1, 0.3 * S); ctx.lineCap = "round";
      Object.keys(tracks).forEach(function (slot) {
        var t = tracks[slot];
        for (k = 1; k < t.length; k++) {
          if (t[k][0] - t[k - 1][0] > 2) continue;
          ctx.strokeStyle = SIDE[D.sides[slot]]; ctx.globalAlpha = 0.08 + 0.5 * (t[k][0] - from) / Math.max(1, cur - from);
          ctx.beginPath(); ctx.moveTo(px(t[k - 1][1]), py(t[k - 1][2])); ctx.lineTo(px(t[k][1]), py(t[k][2])); ctx.stroke();
        }
      });
      ctx.globalAlpha = 1;
      ctx.strokeStyle = "#ffe98a"; ctx.lineWidth = Math.max(1.2, 0.35 * S);
      var prev = null;
      for (i = from; i <= cur; i++) {
        var b = D.frames[i].b;
        if (b && prev) { ctx.globalAlpha = 0.15 + 0.7 * (i - from) / Math.max(1, cur - from); ctx.beginPath(); ctx.moveTo(px(prev[0]), py(prev[1])); ctx.lineTo(px(b[0]), py(b[1])); ctx.stroke(); }
        prev = b;
      }
      ctx.globalAlpha = 1;
    }
    // players
    var r = Math.max(3.5, 1.05 * S);
    fr.p.forEach(function (o) {
      var x = px(o[1]), y = py(o[2]);
      ctx.fillStyle = "rgba(0,0,0,0.28)"; ctx.beginPath(); ctx.ellipse(x + 0.25 * S, y + 0.35 * S, r, r * 0.8, 0, 0, 6.2832); ctx.fill();
      ctx.fillStyle = SIDE[D.sides[o[0]]]; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.lineWidth = Math.max(1, 0.18 * S); ctx.stroke();
    });
    // ball, or the last place it was seen
    var rb = Math.max(3, 0.8 * S);
    if (fr.b) {
      ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "#111"; ctx.lineWidth = Math.max(1, 0.22 * S);
      ctx.beginPath(); ctx.arc(px(fr.b[0]), py(fr.b[1]), rb, 0, 6.2832); ctx.fill(); ctx.stroke();
    } else {
      var seen = null, when = 0;
      for (i = cur; i >= 0; i--) if (D.frames[i].b) { seen = D.frames[i].b; when = cur - i; break; }
      if (seen) {
        ctx.strokeStyle = "#e8eef0"; ctx.lineWidth = Math.max(1.4, 0.3 * S); ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.arc(px(seen[0]), py(seen[1]), rb * 2.1, 0, 6.2832); ctx.stroke(); ctx.setLineDash([]);
      }
    }
    // readouts
    var f = fr.f, t = f / D.fps, mm = Math.floor(t / 60), ss = (t % 60).toFixed(1).padStart(4, "0");
    document.getElementById("fno").textContent = "frame " + f.toLocaleString("en-US");
    document.getElementById("clock").textContent = "video clock " + mm + ":" + ss;
    document.getElementById("objs").textContent = fr.p.length + " tracked objects";
    var sinceSeen = null;
    if (!fr.b) { for (i = cur; i >= 0; i--) if (D.frames[i].b) { sinceSeen = (cur - i) / D.fps; break; } }
    document.getElementById("ballst").textContent = fr.b ? "ball tracked" : (sinceSeen === null ? "ball not tracked in this window yet" : "ball not tracked, last seen " + sinceSeen.toFixed(1) + " s ago");
    if (D.labels) {
      var L = LAB[D.labels[cur]], el = document.getElementById("lab");
      document.getElementById("banner").hidden = false;
      el.textContent = L[0]; el.style.background = L[1]; document.getElementById("lab-note").textContent = L[2];
    }
    scrub.value = cur;
  }

  function setFrame(i) { cur = Math.max(0, Math.min(N - 1, i)); draw(); }
  function tick(ts) {
    if (!playing) return;
    acc += (ts - last) / 1000 * D.fps * speed; last = ts;
    var step = Math.floor(acc);
    if (step > 0) { acc -= step; if (cur + step >= N - 1) { setFrame(N - 1); setPlaying(false); return; } setFrame(cur + step); }
    requestAnimationFrame(tick);
  }
  function setPlaying(p) {
    playing = p; playBtn.textContent = p ? "Pause" : "Play";
    if (p) { if (cur >= N - 1) setFrame(0); last = performance.now(); acc = 0; requestAnimationFrame(tick); }
  }
  playBtn.addEventListener("click", function () { setPlaying(!playing); });
  scrub.addEventListener("input", function () { setFrame(+scrub.value); });
  document.getElementById("trails").addEventListener("change", function (e) { showTrails = e.target.checked; draw(); });
  Array.prototype.forEach.call(document.querySelectorAll("[data-sp]"), function (b) {
    b.addEventListener("click", function () {
      speed = +b.getAttribute("data-sp");
      Array.prototype.forEach.call(document.querySelectorAll("[data-sp]"), function (o) { o.setAttribute("aria-pressed", String(o === b)); });
    });
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { setFrame(cur + 1); } else if (e.key === "ArrowLeft") { setFrame(cur - 1); } else if (e.key === " " && e.target === document.body) { e.preventDefault(); setPlaying(!playing); }
  });
  window.addEventListener("resize", function () { buildStatic(); draw(); });
  buildStatic(); draw();
})();
</script></main></body></html>
