umns, which is spellF1. Flip the switch to move the 2 wrong seconds from the middle of a turn to the edge between two.</span></figcaption></figure><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;
            out.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
        }
    }
    return out;
}
function signedArea(points) {
    let area = 0;
    for (let index = 0; index < points.length; index++) {
        const [ax, ay] = points[index];
        const [bx, by] = points[(index + 1) % points.length];
        area += ax * by - bx * ay;
    }
    return area / 2;
}
const oriented = (points) => (signedArea(points) < 0 ? [...points].reverse() : points);

/* The model behind the IoU bench: the 30 s worked example from the brief, and the spellF1 rules
   from evaluation/possession_metrics.py (same-team pairs, greedy one-to-one by IoU, F1 = 2tp/(nG+nP)
   at each pass mark, averaged). Pure: no DOM, no kit. Everything the figure shows comes from here. */

const SECONDS = 30;
const MARKS = [0.3, 0.4, 0.5, 0.6, 0.7];

/* ground truth: H 10 s, A 6 s, a 3 s dead ball, H 11 s */
const TRUTH = [
  { id: 0, s: 0, e: 10, team: "H" },
  { id: 1, s: 10, e: 16, team: "A" },
  { id: 2, s: 16, e: 19, team: "D" },
  { id: 3, s: 19, e: 30, team: "H" },
];

/* "your file" is six slots on the bench. In "middle" the 2 wrong seconds sit inside the last turn.
   In "edge" they sit at the boundary of the first two turns, and the last three slots collapse. */
const FILES = {
  middle: [
    { s: 0, e: 10, team: "H" },
    { s: 10, e: 16, team: "A" },
    { s: 16, e: 19, team: "D" },
    { s: 19, e: 23, team: "H" },
    { s: 23, e: 25, team: "A" },
    { s: 25, e: 30, team: "H" },
  ],
  edge: [
    { s: 0, e: 8, team: "H" },
    { s: 8, e: 16, team: "A" },
    { s: 16, e: 19, team: "D" },
    { s: 19, e: 19, team: "H" },
    { s: 19, e: 19, team: "A" },
    { s: 19, e: 30, team: "H" },
  ],
};
const MODES = ["middle", "edge"];

/* possessions: maximal runs of H or A. D is never a turn and always cuts one turn from the next. */
function spells(slots) {
  const out = [];
  for (let id = 0; id < slots.length; id++) {
    const slot = slots[id];
    if (slot.team === "D" || slot.e - slot.s <= 1e-9) continue;
    const last = out[out.length - 1];
    if (last && last.team === slot.team && Math.abs(last.e - slot.s) < 1e-9) { last.e = slot.e; continue; }
    out.push({ id, s: slot.s, e: slot.e, team: slot.team });
  }
  return out;
}

function overlaps(gt, pred) {
  const list = [];
  gt.forEach((g, gi) => pred.forEach((p, pi) => {
    if (g.team !== p.team || p.e <= g.s || g.e <= p.s) return;
    const inter = [Math.max(g.s, p.s), Math.min(g.e, p.e)];
    const union = [Math.min(g.s, p.s), Math.max(g.e, p.e)];
    list.push({ gi, pi, iou: (inter[1] - inter[0]) / (union[1] - union[0]), inter, union });
  }));
  list.sort((a, b) => b.iou - a.iou || a.gi - b.gi || a.pi - b.pi);
  return list;
}

/* One greedy pass, highest IoU first, each real turn and each of yours used once. The pairs matched
   at pass mark t are exactly the pairs of this pass with iou >= t, which is what the scorer does. */
function pairing(gt, pred) {
  const usedG = new Set(), usedP = new Set(), pairs = [];
  for (const o of overlaps(gt, pred)) {
    if (usedG.has(o.gi) || usedP.has(o.pi)) continue;
    usedG.add(o.gi); usedP.add(o.pi); pairs.push(o);
  }
  return pairs;
}

function score(gt, pred) {
  const pairs = pairing(gt, pred);
  const perMark = MARKS.map((mark) => {
    const tp = pairs.filter((p) => p.iou >= mark - 1e-9).length;
    const f1 = tp ? (2 * tp) / (gt.length + pred.length) : 0;
    return { mark, tp, f1 };
  });
  const mean = perMark.reduce((sum, m) => sum + m.f1, 0) / MARKS.length;
  const matchedP = new Set(pairs.map((p) => p.pi));
  return { pairs, perMark, mean, nG: gt.length, nP: pred.length, invented: pred.map((_, i) => i).filter((i) => !matchedP.has(i)) };
}

/* frames correct, for the readout: truth and file compared second by second (25 fps) */
function framesCorrect(slots) {
  const label = (list, t) => { const hit = list.find((x) => t >= x.s && t < x.e); return hit ? hit.team : "-"; };
  let right = 0, total = SECONDS * 25;
  for (let f = 0; f < total; f++) { const t = (f + 0.5) / 25; if (label(TRUTH, t) === label(slots, t)) right++; }
  return right / total;
}

/* Geometry of the IoU bench. `k` is the kit (injected, so the same source runs in Node and inline in the page),
   `P` the projection. World units are about 1 px; x runs along the timeline (7 units = 1 s), z is up. */

const CFG = {
  UX: 7, X0: -105,
  YR: -26, YY: 26,                 // lane centres: real turns (back), your turns (front)
  BLOCK_Z: 3, BLOCK_H: 10, SPACER_H: 3.4, BLOCK_D: 18,
  BEAM_Z: 38, BEAM_H: 8, BEAM_Y: 7,
  COLS: [-72, -36, 0, 36, 72], COL_Y: 66, COL_D: 12, COL_H: 26, CAP_LO: 5.5, CAP_SPAN: 15,
  DIAL_R: 19, DIAL_Z: 12, DIAL_H: 10, IOU_AT: [-48, -85], F1_AT: [48, -85],
  SWEEP_FROM: -0.75 * Math.PI, SWEEP: 1.5 * Math.PI,
  SWITCH: { x0: -38, x1: -8, y: 88 },
  PLATE: { x: -142, y: -102, w: 284, d: 200, r: 9 }, PLATE_H: 12, FOOT_H: 5,
};

function geometry(k, P) {
  const C = CFG;
  const at = (p) => k.iso(p, P);
  const S = (paths, style) => k.solidSvg(paths, style);
  const L = (d, style) => k.lineSvg(d, style);
  const D = (points, style) => k.dotsSvg(points, style);
  const xOf = (t) => C.X0 + t * C.UX;
  const byDepth = (points) => [...points].sort((a, b) => k.depthOf([a[0], a[1], 0], P) - k.depthOf([b[0], b[1], 0], P));
  const angleOf = (v) => C.SWEEP_FROM + v * C.SWEEP;
  const closed = (points) => "M" + points.map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L") + "Z";

  /* ---------- the bench ---------- */
  function plate() {
    const PL = C.PLATE, out = [`<path class="iso-halo" d="${k.haloOf(PL, -C.PLATE_H - C.FOOT_H, C.PLATE_H, P)}"/>`];
    for (const [x, y] of byDepth(k.corners(PL, 20))) {
      out.push(S(k.cylinder(x, y, 7, -C.PLATE_H - C.FOOT_H, 1.6, P, 28), { tone: "lo" }));
      out.push(S(k.cylinder(x, y, 5.4, -C.PLATE_H - C.FOOT_H + 1.6, C.FOOT_H - 1.6, P, 28), { tone: "mid" }));
    }
    out.push(S(k.slabOf(PL, -C.PLATE_H, C.PLATE_H, P, 8, 1.6), { tone: "mid" }));
    out.push(L(k.planOutline(k.insetPlan(PL, 5), 0, P), { tone: "lo" }));
    const screws = k.corners(PL, 10);
    out.push(L(screws.map(([x, y]) => k.ring(x, y, 2.2, 0, P, 16)).join(""), { tone: "lo" }));
    out.push(D(screws.map(([x, y]) => at([x, y, 0])), { size: 0.5 }));
    /* label plate with three engraved rule lines, front right */
    const tag = { x: 98, y: 76, w: 34, d: 17, r: 2 };
    out.push(S(k.slabOf(tag, 0, 0.8, P, 4), { tone: "lo", crease: "none" }));
    out.push(L(k.planOutline(k.insetPlan(tag, 1.6), 0.8, P, 4), { tone: "faint" }));
    [[tag.y + 5, 22], [tag.y + 8.5, 15], [tag.y + 12, 19]].forEach(([y, len]) => {
      out.push(L(k.lineOnTop([tag.x + 5, y], [tag.x + 5 + len, y], 0.8, P), { tone: "lo", free: true }));
    });
    out.push(D([at([tag.x + 3, tag.y + 3, 0.8]), at([tag.x + tag.w - 3, tag.y + tag.d - 3, 0.8])], { size: 0.45 }));
    return out.join("");
  }

  function console_() {
    const out = [], B = { x: -112, y: -101, w: 224, d: 31, r: 5 };
    out.push(`<path class="iso-halo" d="${k.haloOf(B, 0, 12, P)}" style="filter:blur(5px)"/>`);
    out.push(S(k.slabOf(B, 0, C.DIAL_Z, P, 6, 1), { tone: "mid" }));
    out.push(L(k.planOutline(k.insetPlan(B, 3.4), C.DIAL_Z, P, 6), { tone: "faint" }));
    out.push(D([[B.x + 6, B.y + 6], [B.x + B.w - 6, B.y + 6], [B.x + 6, B.y + B.d - 6], [B.x + B.w - 6, B.y + B.d - 6]].map(([x, y]) => at([x, y, C.DIAL_Z])), { size: 0.45 }));
    return out.join("");
  }

  function dial(centre, label) {
    const [x, y] = centre, R = C.DIAL_R, top = C.DIAL_Z + C.DIAL_H, out = [];
    out.push(S(k.cylinder(x, y, R, C.DIAL_Z, C.DIAL_H, P, 64, 0.8), { tone: "hi", crease: "lo" }));
    out.push(L(k.knurl(x, y, R, top - 3.4, top, 84, P, 0.3), { tone: "lo" }));
    out.push(L(k.sideArc(x, y, R, top - 3.4, P, 40), { tone: "faint" }));
    out.push(L(k.ring(x, y, R - 2.2, top, P, 64), { tone: "lo" }));
    const t = k.radialTicks(x, y, R - 3, 50, 5, top, [1.3, 2.8], P, C.SWEEP_FROM, C.SWEEP);
    out.push(L(t.minor, { tone: "lo" }), L(t.major, { tone: "mid" }));
    out.push(L(k.ring(x, y, 1.6, top, P, 16), { tone: "mid" }));
    out.push(k.faceTextSvg(k.topMatrix([x, y + 10.5], top, P, "x"), label, { size: 2.8, tone: "mid", anchor: "middle" }));
    return out.join("");
  }

  const needle = (centre, v) => {
    const [x, y] = centre, a = angleOf(Math.min(1, Math.max(0, v))), top = C.DIAL_Z + C.DIAL_H + 0.2;
    return k.lineOnTop([x - Math.sin(a) * 3.6, y + Math.cos(a) * 3.6], [x + Math.sin(a) * (C.DIAL_R - 2.2), y - Math.cos(a) * (C.DIAL_R - 2.2)], top, P);
  };

  /* a pass-mark pin beside the IoU dial: lit once the needle has reached it */
  const pinAt = (m) => {
    const a = angleOf(m), r = C.DIAL_R + 4.2;
    return [C.IOU_AT[0] + Math.sin(a) * r, C.IOU_AT[1] - Math.cos(a) * r];
  };
  function pin(m, on) {
    const [x, y] = pinAt(m);
    return S(k.cylinder(x, y, 1.9, C.DIAL_Z, 4.2, P, 16, 0.3), on ? { tone: "lit", lit: true } : { tone: "mid" });
