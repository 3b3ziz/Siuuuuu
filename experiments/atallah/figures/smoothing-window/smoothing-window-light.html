 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>The hood: ±w frames, the lit part</span><span class="iso-key"><svg class="iso-swatch" data-mark="raised" viewBox="0 0 16 10" aria-hidden="true"><path d="M2 4.5 8 1.5 14 4.5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Carriage, vote dial and stamp</span><span class="iso-key"><svg class="iso-swatch" data-mark="dim" viewBox="0 0 16 10" aria-hidden="true"><path d="M1.5 5h13"/></svg>Pegs after a sweep: lime has a partner, red is invented or missed</span></span><span class="iso-caption">The input runs under the hood. At each frame the hood spans ±w frames, the dial leans to whichever team fills more of it (ties go to home, as in the baseline), and the stamp prints that label on the output lane. Turn the knob: at 0 every blip survives and 18 turns come out, spellF1 0.13. At ±12 only the longest blip is left (0.80). At ±25 the output matches the truth (1.00). At ±50 the genuine 2 s away turn is shrinking (0.80), and at ±125 it is gone (0.53). Frames right stay between 90% and 100% the whole way. Synthetic strip. On the real match the baseline scores 0.05 at 0, 0.20 at ±25, 0.24 at ±50 and 0.22 at ±125: the same rise and fall, peaking later, because real possessions are longer.</span></figcaption></figure><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;

/* The model behind the smoothing window: a synthetic 25 s label strip, the majority-vote filter of

  { s: 9, e: 11, team: "A" },
  { s: 11, e: 18, team: "H" },
  { s: 18, e: 25, team: "A" },

/* the tracker's mistakes: short wrong bursts of 0.2 to 0.5 s inside long turns */

  { at: 5.4, len: 0.2, team: "A" },
  { at: 7.3, len: 0.44, team: "A" },
  { at: 13.2, len: 0.28, team: "A" },
  { at: 15.9, len: 0.6, team: "A" },
  { at: 20.5, len: 0.36, team: "H" },
  { at: 22.8, len: 0.24, team: "H" },

const code = (team) => (team === "H" ? 0 : 1);
